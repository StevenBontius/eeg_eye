[project]
name = "eeg-eye"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "StevenBontius", email = "steven@bonti.us" }
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pathlib>=1.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.10.0",
    "torchmetrics>=1.9.0",
    "typing>=3.10.0.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.7",
]
